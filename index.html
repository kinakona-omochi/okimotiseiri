<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>おもいノート</title>
<link rel="icon" id="faviconLink">
<link rel="apple-touch-icon" id="appleTouchIcon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おもいノート">
<meta name="theme-color" content="#232838">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef0f6;
    --card: #ffffff;
    --line: #dfe2ec;
    --ink: #232838;
    --ink-soft: #767c92;
    --in-color: #b3812a;   /* 学び・IN：あめ色 */
    --in-soft: #faf1de;
    --out-color: #1f7a63;  /* 発信・OUT：深緑 */
    --out-soft: #dcefe8;
    --moya-color: #7d5aa6; /* モヤモヤ：藤色 */
    --moya-soft: #ece4f5;
    --task-color: #33538f; /* タスク：藍 */
    --task-soft: #dfe6f5;
    --diary-color: #a24a5a; /* 日記：えんじ */
    --diary-soft: #f4dfe3;
    --accent: #e2725b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:#0f1320;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
  }

  header.top{
    padding:18px 20px 14px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    color:var(--accent);
    margin-bottom:4px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:24px;
    margin:0;
    letter-spacing:0.02em;
  }

  .view{ display:none; padding:16px 20px 8px; }
  .view.active{ display:block; }

  /* ---- 記録タブ ---- */
  .type-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
  }
  .type-btn{
    padding:12px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .type-btn .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; background:var(--line); }
  .type-btn.active.in{ background:var(--in-soft); border-color:var(--in-color); color:var(--in-color); }
  .type-btn.active.in .dot{ background:var(--in-color); }
  .type-btn.active.out{ background:var(--out-soft); border-color:var(--out-color); color:var(--out-color); }
  .type-btn.active.out .dot{ background:var(--out-color); }
  .type-btn.active.moya{ background:var(--moya-soft); border-color:var(--moya-color); color:var(--moya-color); }
  .type-btn.active.moya .dot{ background:var(--moya-color); }

  textarea, input[type=text]{
    width:100%;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 13px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    color:var(--ink);
    background:#fff;
  }
  textarea{ min-height:56px; resize:none; line-height:1.5; }
  textarea:focus, input:focus{ outline:none; border-color:var(--accent); }

  .save-row{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:10px; }
  .save-status{ font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono', monospace; }
  .save-btn{
    padding:10px 24px;
    border-radius:20px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.04em;
    cursor:pointer;
  }
  .save-btn:active{ transform:scale(0.97); }

  .section-title{
    font-family:'Shippori Mincho', serif;
    font-size:13px;
    color:var(--ink-soft);
    margin:20px 0 8px 2px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .filter-row{ display:flex; gap:6px; margin-bottom:10px; }
  .filter-btn{
    padding:6px 12px; border-radius:14px; border:1.3px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .filter-btn.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .row-edit{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0 4px; }
  .edit-area{ width:100%; font-size:16px; min-height:50px; margin-top:2px; }
  .edit-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .edit-actions button{
    border:none; border-radius:8px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .edit-save{ background:var(--ink); color:#fff; }
  .edit-cancel{ background:#f0f1f5; color:var(--ink-soft); }
  .day-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin:12px 0 5px 2px;
  }
  .card-row{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 13px;
    margin-bottom:8px;
  }
  .card-head{ display:flex; align-items:flex-start; gap:10px; }
  .tag{
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:600;
    padding:4px 9px;
    border-radius:8px;
    margin-top:1px;
    line-height:1.4;
  }
  .tag.in{ background:var(--in-soft); color:var(--in-color); }
  .tag.out{ background:var(--out-soft); color:var(--out-color); }
  .tag.moya{ background:var(--moya-soft); color:var(--moya-color); }
  .tag.diary{ background:var(--diary-soft); color:var(--diary-color); }
  .row-body{ flex:1; min-width:0; }
  .row-text{ font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .row-del{ flex-shrink:0; background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:0 2px; line-height:1; }
  .row-time{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-soft); margin-top:5px; }
  .followups{ margin:8px 0 0 8px; padding-left:10px; border-left:2px solid var(--moya-soft); }
  .followup-item{ font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; line-height:1.5; }
  .followup-item .ft{ font-family:'JetBrains Mono', monospace; font-size:9.5px; margin-right:6px; }
  .followup-add{ display:flex; gap:6px; margin-top:6px; margin-left:8px; }
  .followup-add input{ flex:1; font-size:16px; padding:7px 10px; border-radius:8px; }
  .followup-add button{
    border:none; background:var(--moya-color); color:#fff; border-radius:8px;
    padding:0 12px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:26px 10px; font-family:'Shippori Mincho', serif; }

  /* ---- タスクタブ ---- */
  .task-add{ display:flex; gap:8px; }
  .task-add input{ flex:1; }
  .task-add button{
    flex-shrink:0; border:none; background:var(--task-color); color:#fff;
    border-radius:12px; padding:0 16px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .task-row{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin-bottom:7px; display:flex; align-items:center; gap:10px;
  }
  .status-pill{
    flex-shrink:0;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; font-weight:700;
    padding:5px 10px; border-radius:14px;
    cursor:pointer; border:1.5px solid;
    white-space:nowrap;
  }
  .status-pill.todo{ background:#f2f3f7; color:var(--ink-soft); border-color:var(--line); }
  .status-pill.doing{ background:var(--task-soft); color:var(--task-color); border-color:var(--task-color); }
  .status-pill.done{ background:var(--out-soft); color:var(--out-color); border-color:var(--out-color); }
  .task-text{ flex:1; font-size:13.5px; line-height:1.4; word-break:break-word; }
  .task-text.done{ text-decoration:line-through; color:var(--ink-soft); }

  /* ---- 振り返りタブ ---- */
  .stat-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .stat-title{ font-family:'Shippori Mincho', serif; font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
  .streak-num{ font-family:'JetBrains Mono', monospace; font-size:34px; font-weight:600; color:var(--accent); }
  .streak-unit{ font-size:12.5px; color:var(--ink-soft); margin-left:4px; }
  .meter{ position:relative; height:20px; border-radius:10px; overflow:hidden; background:var(--line); margin-top:4px;}
  .meter-in, .meter-out{ position:absolute; top:0; bottom:0; transition:width .5s ease; }
  .meter-in{ left:0; background:var(--in-color); }
  .meter-out{ right:0; background:var(--out-color); }
  .meter-target{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--accent); }
  .meter-legend{ display:flex; justify-content:space-between; margin-top:7px; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-soft); }
  .task-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .task-stat-num{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:600; }
  .task-stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .backup-note{ font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px; }
  .backup-row{ display:flex; gap:8px; }
  .backup-btn{
    flex:1; padding:10px 0; border-radius:10px; border:1.5px solid var(--ink);
    background:var(--ink); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .backup-btn.ghost{ background:#fff; color:var(--ink); }
  .backup-area{ margin-top:10px; width:100%; min-height:80px; font-size:16px; }
  .backup-msg{ font-size:11.5px; color:var(--out-color); margin-top:8px; min-height:14px; }

  /* ---- 下部タブバー ---- */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:12px 16px calc(20px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .tab-item{
    background:none; border:none; cursor:pointer; padding:0;
  }
  .tab-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--ink-soft);
    padding:10px 20px;
    line-height:1;
  }
  .tab-badge .txt{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tab-badge.circle{ border-radius:999px; }
  .tab-badge.square{ border-radius:7px; }
  .tab-badge.diamond{ clip-path:polygon(9% 0%,91% 0%,100% 50%,91% 100%,9% 100%,0% 50%); padding:10px 24px; }
  .tab-badge.hexagon{ clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); padding:10px 22px; }
  .tab-item.active .tab-badge{ background:var(--ink); border-color:var(--ink); }
  .tab-item.active .tab-badge .txt{ color:#fff; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="eyebrow" id="eyebrow">CAPTURE</div>
    <h1 id="viewTitle">記録する</h1>
  </header>

  <!-- 記録タブ -->
  <div class="view active" id="view-capture">
    <div class="type-grid">
      <button class="type-btn active in" data-type="in"><span class="dot"></span>IN・学んだ</button>
      <button class="type-btn out" data-type="out"><span class="dot"></span>OUT・発信した</button>
      <button class="type-btn moya" data-type="moya" style="grid-column:1/3;"><span class="dot"></span>モヤモヤ・考えても仕方ないこと</button>
    </div>
    <textarea id="entryText" placeholder="一言でOK"></textarea>
    <div class="save-row"><span class="save-status" id="saveStatus"></span><button class="save-btn" id="saveEntry">記帳する</button></div>

    <div class="section-title">記録一覧</div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="in">IN</button>
      <button class="filter-btn" data-filter="out">OUT</button>
      <button class="filter-btn" data-filter="moya">モヤモヤ</button>
    </div>
    <div id="entryList"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- タスクタブ -->
  <div class="view" id="view-task">
    <div class="task-add">
      <input type="text" id="taskText" placeholder="やることを入力">
      <button id="addTask">追加</button>
    </div>
    <div class="section-title">タスク一覧</div>
    <div id="taskList"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- 日記タブ -->
  <div class="view" id="view-diary">
    <textarea id="diaryText" placeholder="今日のことを3〜4行くらいで" rows="4"></textarea>
    <div class="save-row"><span class="save-status" id="diarySaveStatus"></span><button class="save-btn" id="saveDiary">書く</button></div>
    <div class="section-title">日記一覧</div>
    <div id="diaryList"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- 振り返りタブ -->
  <div class="view" id="view-review">
    <div class="stat-card">
      <div class="stat-title">記録の継続日数</div>
      <span class="streak-num" id="streakNum">0</span><span class="streak-unit">日連続</span>
    </div>
    <div class="stat-card">
      <div class="stat-title">今週のIN・OUTバランス（目安：IN 3 : OUT 7）</div>
      <div class="meter">
        <div class="meter-in" id="meterIn" style="width:0%"></div>
        <div class="meter-out" id="meterOut" style="width:0%"></div>
        <div class="meter-target" style="left:30%"></div>
      </div>
      <div class="meter-legend">
        <span>IN <span id="inCount">0</span>件</span>
        <span>OUT <span id="outCount">0</span>件</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-title">タスクの状況</div>
      <div class="task-stat-grid">
        <div><div class="task-stat-num" style="color:var(--ink-soft)" id="todoNum">0</div><div class="task-stat-label">未着手</div></div>
        <div><div class="task-stat-num" style="color:var(--task-color)" id="doingNum">0</div><div class="task-stat-label">進行中</div></div>
        <div><div class="task-stat-num" style="color:var(--out-color)" id="doneNum">0</div><div class="task-stat-label">完了</div></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-title">データのバックアップ</div>
      <div class="backup-note">記録はデータベースに保存されるので、ホーム画面から開いても消えなくなりました。念のため、時々「書き出す」でコピーし、メモアプリなどにも保管しておくとより安心です。</div>
      <div class="backup-row">
        <button class="backup-btn" id="exportBtn">書き出す（コピー）</button>
        <button class="backup-btn ghost" id="importBtn">読み込む</button>
      </div>
      <textarea id="backupArea" class="backup-area" placeholder="書き出した内容、または読み込みたい内容をここに貼り付け" style="display:none;"></textarea>
      <div id="backupMsg" class="backup-msg"></div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab-item active" data-view="capture">
      <span class="tab-badge circle"><span class="txt">記録</span></span>
    </button>
    <button class="tab-item" data-view="task">
      <span class="tab-badge square"><span class="txt">タスク</span></span>
    </button>
    <button class="tab-item" data-view="diary">
      <span class="tab-badge hexagon"><span class="txt">日記</span></span>
    </button>
    <button class="tab-item" data-view="review">
      <span class="tab-badge diamond"><span class="txt">振り返り</span></span>
    </button>
  </nav>
</div>

<script>
let data = { logs: [], tasks: [], diary: [] };
let currentType = 'in';
let currentView = 'capture';
let currentFilter = 'all';
let editingId = null;
let editingDiaryId = null;

const titles = { capture: ['CAPTURE','記録する'], task: ['TASKS','タスク管理'], diary: ['DIARY','日記'], review: ['REVIEW','振り返り'] };

// ---- タブ切り替え ----
document.querySelectorAll('.tab-item').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
function switchView(v){
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(el => el.classList.toggle('active', el.dataset.view===v));
  document.getElementById('eyebrow').textContent = titles[v][0];
  document.getElementById('viewTitle').textContent = titles[v][1];
  if(v === 'review') renderReview();
}

// ---- タイプ選択 ----
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ---- 永続化（Supabase） ----
const SUPABASE_URL = 'https://gpjoubashlmlzbjxpyft.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g4TO4HMV88QV4gj2NX5vjw_aakSx67J';

async function sb(path, options={}){
  const { prefer, ...rest } = options;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...rest,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': prefer || 'return=representation',
      ...(rest.headers || {})
    }
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`Supabase error ${res.status}: ${t}`);
  }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

async function loadData(){
  try{
    const [logs, tasks, diary] = await Promise.all([
      sb('logs?select=*&order=ts.desc'),
      sb('tasks?select=*&order=ts.desc'),
      sb('diary?select=*&order=ts.desc')
    ]);
    data.logs = (logs || []).map(r => ({ ...r, followups: r.followups || [] }));
    data.tasks = tasks || [];
    data.diary = diary || [];
  }catch(e){
    console.error('読み込み失敗', e);
  }
  renderEntries();
  renderTasks();
  renderDiary();
}

function formatDay(d){
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;
}
function formatTime(d){
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function typeLabel(t){ return t==='in' ? 'IN' : t==='out' ? 'OUT' : 'モヤモヤ'; }

// ---- 記録：追加 ----
document.getElementById('saveEntry').addEventListener('click', async () => {
  const el = document.getElementById('entryText');
  const text = el.value.trim();
  if(!text) return;
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = '保存中…';
  try{
    const [row] = await sb('logs', {
      method:'POST',
      body: JSON.stringify({ type: currentType, text, ts: new Date().toISOString(), followups: [] })
    });
    data.logs.unshift({ ...row, followups: row.followups || [] });
    el.value = '';
    renderEntries();
    if(statusEl){
      statusEl.textContent = '保存済み';
      setTimeout(() => { if(statusEl.textContent === '保存済み') statusEl.textContent = ''; }, 1500);
    }
  }catch(e){
    console.error(e);
    if(statusEl) statusEl.textContent = '保存できませんでした：' + e.message;
  }
});

// ---- フィルター ----
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEntries();
  });
});

async function deleteEntry(id){
  try{
    await sb(`logs?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' });
    data.logs = data.logs.filter(e => e.id !== id);
    renderEntries();
  }catch(e){
    console.error(e);
    alert('削除できませんでした。通信状況を確認してもう一度お試しください。');
  }
}
async function addFollowup(id, text){
  const target = data.logs.find(e => e.id === id);
  if(!target || !text.trim()) return;
  const newFollowups = [...target.followups, { text: text.trim(), ts: new Date().toISOString() }];
  try{
    await sb(`logs?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ followups: newFollowups }), prefer:'return=minimal' });
    target.followups = newFollowups;
    renderEntries();
  }catch(e){
    console.error(e);
  }
}

function renderEntries(){
  const list = document.getElementById('entryList');
  const filtered = currentFilter === 'all' ? data.logs : data.logs.filter(e => e.type === currentFilter);
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  const groups = {}; const order = [];
  filtered.forEach(e => {
    const key = formatDay(new Date(e.ts));
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(e);
  });
  let html = '';
  order.forEach(key => {
    html += `<div class="day-label">${key}</div>`;
    groups[key].forEach(e => {
      const isEditing = e.id === editingId;
      html += `
        <div class="card-row" data-id="${e.id}">
          <div class="card-head">
            <span class="tag ${e.type}">${typeLabel(e.type)}</span>
            <div class="row-body">
              ${isEditing
                ? `<textarea class="edit-area" data-edit-input="${e.id}"></textarea>
                   <div class="edit-actions">
                     <button class="edit-cancel" data-edit-cancel="${e.id}">キャンセル</button>
                     <button class="edit-save" data-edit-save="${e.id}">保存</button>
                   </div>`
                : `<div class="row-text"></div>
                   <div class="row-time">${formatTime(new Date(e.ts))}</div>`
              }
            </div>
            ${isEditing ? '' : `
              <button class="row-edit" data-id="${e.id}">✎</button>
              <button class="row-del" data-id="${e.id}">×</button>`}
          </div>
          ${(e.type==='moya' && !isEditing) ? `<div class="followups" data-fid="${e.id}"></div>
            <div class="followup-add">
              <input type="text" placeholder="後で思ったことを追記" data-fid-input="${e.id}">
              <button data-fid-btn="${e.id}">追記</button>
            </div>` : ''}
        </div>`;
    });
  });
  list.innerHTML = html;

  // テキストは textContent で安全に挿入
  filtered.forEach(e => {
    const row = list.querySelector(`.card-row[data-id="${e.id}"]`);
    if(!row) return;
    if(e.id === editingId){
      const ta = row.querySelector(`[data-edit-input="${e.id}"]`);
      if(ta) ta.value = e.text;
      return;
    }
    row.querySelector('.row-text').textContent = e.text;
    if(e.type === 'moya'){
      const fWrap = row.querySelector(`.followups[data-fid="${e.id}"]`);
      if(fWrap && e.followups.length){
        e.followups.forEach(f => {
          const d = document.createElement('div');
          d.className = 'followup-item';
          const ft = document.createElement('span');
          ft.className = 'ft';
          ft.textContent = formatDay(new Date(f.ts)) + ' ' + formatTime(new Date(f.ts));
          d.appendChild(ft);
          d.appendChild(document.createTextNode(f.text));
          fWrap.appendChild(d);
        });
      }
    }
  });

  list.querySelectorAll('.row-del').forEach(b => b.addEventListener('click', () => deleteEntry(b.dataset.id)));
  list.querySelectorAll('.row-edit').forEach(b => b.addEventListener('click', () => {
    editingId = b.dataset.id;
    renderEntries();
  }));
  list.querySelectorAll('[data-edit-cancel]').forEach(b => b.addEventListener('click', () => {
    editingId = null;
    renderEntries();
  }));
  list.querySelectorAll('[data-edit-save]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.editSave;
    const ta = list.querySelector(`[data-edit-input="${id}"]`);
    const newText = ta.value.trim();
    if(newText){
      try{
        await sb(`logs?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ text: newText }), prefer:'return=minimal' });
        const target = data.logs.find(e => e.id === id);
        if(target) target.text = newText;
      }catch(e){
        console.error(e);
        alert('保存できませんでした。通信状況を確認してもう一度お試しください。');
      }
    }
    editingId = null;
    renderEntries();
  }));
  list.querySelectorAll('[data-fid-btn]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.fidBtn;
      const input = list.querySelector(`[data-fid-input="${id}"]`);
      addFollowup(id, input.value);
      input.value = '';
    });
  });
}

// ---- タスク ----
document.getElementById('addTask').addEventListener('click', async () => {
  const input = document.getElementById('taskText');
  const text = input.value.trim();
  if(!text) return;
  try{
    const [row] = await sb('tasks', {
      method:'POST',
      body: JSON.stringify({ text, status: 'todo', ts: new Date().toISOString() })
    });
    data.tasks.unshift(row);
    input.value = '';
    renderTasks();
  }catch(e){
    console.error(e);
    alert('保存できませんでした。通信状況を確認してもう一度お試しください。');
  }
});

function cycleStatus(s){ return s==='todo' ? 'doing' : s==='doing' ? 'done' : 'todo'; }
function statusLabel(s){ return s==='todo' ? '未着手' : s==='doing' ? '進行中' : '完了'; }

async function toggleTaskStatus(id){
  const t = data.tasks.find(t => t.id === id);
  if(!t) return;
  const newStatus = cycleStatus(t.status);
  try{
    await sb(`tasks?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ status: newStatus }), prefer:'return=minimal' });
    t.status = newStatus;
    renderTasks();
  }catch(e){
    console.error(e);
  }
}

function renderTasks(){
  const list = document.getElementById('taskList');
  if(data.tasks.length === 0){
    list.innerHTML = '<div class="empty">まだタスクがありません</div>';
    return;
  }
  list.innerHTML = '';
  data.tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task-row';
    const pill = document.createElement('button');
    pill.className = 'status-pill ' + t.status;
    pill.textContent = statusLabel(t.status);
    pill.addEventListener('click', () => toggleTaskStatus(t.id));
    const text = document.createElement('div');
    text.className = 'task-text' + (t.status==='done' ? ' done' : '');
    text.textContent = t.text;
    row.appendChild(pill);
    row.appendChild(text);
    list.appendChild(row);
  });
}

// ---- 振り返り ----
function renderReview(){
  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
  const weekLogs = data.logs.filter(e => new Date(e.ts) >= weekAgo && e.type !== 'moya');
  const inCount = weekLogs.filter(e => e.type==='in').length;
  const outCount = weekLogs.filter(e => e.type==='out').length;
  const total = inCount + outCount;
  document.getElementById('meterIn').style.width = (total ? inCount/total*100 : 0) + '%';
  document.getElementById('meterOut').style.width = (total ? outCount/total*100 : 0) + '%';
  document.getElementById('inCount').textContent = inCount;
  document.getElementById('outCount').textContent = outCount;

  document.getElementById('todoNum').textContent = data.tasks.filter(t=>t.status==='todo').length;
  document.getElementById('doingNum').textContent = data.tasks.filter(t=>t.status==='doing').length;
  document.getElementById('doneNum').textContent = data.tasks.filter(t=>t.status==='done').length;

  // 連続記録日数
  const daySet = new Set(data.logs.map(e => {
    const d = new Date(e.ts);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }));
  let streak = 0;
  let cursor = new Date();
  while(true){
    const key = `${cursor.getFullYear()}-${cursor.getMonth()}-${cursor.getDate()}`;
    if(daySet.has(key)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

    backupMsg.textContent = 'コピーできなかったので、下の内容を手動で選択してコピーしてください。';
  }
});

document.getElementById('importBtn').addEventListener('click', async () => {
  if(backupArea.style.display === 'none' || !backupArea.value.trim()){
    backupArea.style.display = 'block';
    backupArea.value = '';
    backupArea.focus();
    backupMsg.textContent = 'バックアップした内容をここに貼り付けてから、もう一度「読み込む」を押してください。';
    return;
  }
  try{
    const parsed = JSON.parse(backupArea.value.trim());
    if(!parsed || !Array.isArray(parsed.logs) || !Array.isArray(parsed.tasks)){
      throw new Error('形式が違います');
    }
    if(!Array.isArray(parsed.diary)) parsed.diary = [];
    backupMsg.textContent = '読み込み中…';
    if(parsed.logs.length){
      await sb('logs', { method:'POST', prefer:'return=minimal', body: JSON.stringify(
        parsed.logs.map(l => ({ type: l.type, text: l.text, ts: l.ts, followups: l.followups || [] }))
      )});
    }
    if(parsed.tasks.length){
      await sb('tasks', { method:'POST', prefer:'return=minimal', body: JSON.stringify(
        parsed.tasks.map(t => ({ text: t.text, status: t.status, ts: t.ts }))
      )});
    }
    if(parsed.diary.length){
      await sb('diary', { method:'POST', prefer:'return=minimal', body: JSON.stringify(
        parsed.diary.map(d => ({ text: d.text, ts: d.ts }))
      )});
    }
    await loadData();
    renderReview();
    backupMsg.textContent = '読み込みました（今あるデータに追加する形で復元しました）。';
  }catch(e){
    console.error(e);
    backupMsg.textContent = '読み込めませんでした。貼り付けた内容を確認してください。';
  }
});

// ---- ホーム画面アイコン生成（丸角×コーラル背景×太い白マークでシンプルかつ目立つように） ----
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function makeAppIcon(size){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  // 背景
  roundRectPath(ctx, 0, 0, size, size, size*0.22);
  ctx.fillStyle = '#e2725b';
  ctx.fill();
  // 中央の丸（紙面）
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.34, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  // 太い「＋」マーク（クイック記録を象徴）
  ctx.strokeStyle = '#e2725b';
  ctx.lineWidth = size*0.10;
  ctx.lineCap = 'round';
  const m = size*0.36;
  ctx.beginPath();
  ctx.moveTo(size/2, m); ctx.lineTo(size/2, size-m);
  ctx.moveTo(m, size/2); ctx.lineTo(size-m, size/2);
  ctx.stroke();
  return c.toDataURL('image/png');
}
document.getElementById('appleTouchIcon').href = makeAppIcon(180);
document.getElementById('faviconLink').href = makeAppIcon(64);
